<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartas — Sin Filtros</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="stylesheet" href="../css/docs.css">
  <style>
    body {
      background: #000;
      color: var(--secondary-color);
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--title-color);
      margin: 0 0 1rem;
    }

    .top-actions {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.1rem;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      font-family: var(--text-font);
      border: 1px solid transparent;
    }

    .button-play {
      background: var(--title-color);
      color: #08100e;
      border: 0;
      cursor: pointer;
    }

    .button-home {
      background: rgba(255, 255, 255, 0.12);
      color: var(--secondary-color);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .hidden {
      display: none;
    }

    #cards-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .cards-grid {
      width: 100%;
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.75rem;
    }

    .card {
      width: 100%;
      aspect-ratio: 2 / 3;
      perspective: 900px;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s ease;
    }

    .card.is-flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      overflow: hidden;
      backface-visibility: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .card-front img,
    .card-back img {
      padding: 0.35rem;
      box-sizing: border-box;
    }

    .card-back {
      transform: rotateY(180deg);
      background: #ffffff;
    }

    .card-back img {
      filter: contrast(1.12) brightness(1.05);
    }

    .interaction-counter {
      position: fixed;
      top: 1rem;
      right: 1rem;
      font-size: 0.9rem;
      color: var(--title-color);
      opacity: 0.7;
      z-index: 50;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .scroll-hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      z-index: 50;
      pointer-events: none;
      display: none;
    }

    .end-game-btn {
      background: var(--title-color);
      color: #08100e;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      border: 0;
      font-weight: 800;
      cursor: pointer;
      font-family: var(--text-font);
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: opacity 0.4s ease, transform 0.2s ease;
      box-shadow: 0 0 20px rgba(195, 250, 44, 0.3);
      opacity: 0.4;
      pointer-events: none;
    }

    .end-game-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .end-game-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(195, 250, 44, 0.6);
    }

    .end-game-btn-cards {
      display: block;
      width: fit-content;
      margin: 2.5rem auto 0;
      padding: 1rem 2rem;
      background: var(--title-color);
      color: #08100e;
      border-radius: 10px;
      border: none;
      font-weight: 900;
      cursor: pointer;
      font-family: var(--text-font);
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      box-shadow: 0 0 25px rgba(195, 250, 44, 0.5);
    }

    .end-game-btn-cards:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(195, 250, 44, 0.6);
    }

    .page-flip-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .page-flip-container.active {
      pointer-events: auto;
      opacity: 1;
    }

    .page-flip {
      position: absolute;
      inset: 0;
      background: #000;
      perspective: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .flip-page {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: flipPageDown 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
    }

    @keyframes flipPageDown {
      0% {
        transform: rotateX(0deg) translateZ(0);
        opacity: 1;
      }
      100% {
        transform: rotateX(90deg) translateZ(-400px);
        opacity: 0;
      }
    }

    .final-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 998;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.8s ease 0.4s;
    }

    .final-screen.active {
      opacity: 1;
    }

    .final-screen video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .final-controls {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      gap: 1rem;
      opacity: 0;
      animation: fadeInDelay 0.8s ease 2s forwards;
    }

    @keyframes fadeInDelay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .final-btn {
      background: var(--title-color);
      color: #08100e;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      border: 0;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--text-font);
      transition: transform 0.2s, background 0.2s;
    }

    .final-btn:hover {
      transform: scale(1.05);
      background: rgba(195, 250, 44, 0.9);
    }
  </style>
</head>
<body>
  <div class="interaction-counter">
    <span id="counter">0 / 8</span>
  </div>

  <div class="wrap">
    <h1>Cartas Sin Filtros</h1>
    <div class="top-actions">
      <button id="start-game" class="button button-play" type="button">Jugar</button>
      <a class="button button-home" href="index.html">Home</a>
    </div>

    <section id="cards-section" class="hidden" aria-label="Cartas aleatorias">
      <div id="cards-grid" class="cards-grid"></div>
      <button id="end-game-btn-cards" class="end-game-btn-cards">Terminar Juego</button>
    </section>

    <div class="scroll-hint" id="scroll-hint"></div>
  </div>

  <div class="page-flip-container" id="page-flip-container">
    <div class="page-flip"><div class="flip-page"></div></div>
  </div>

  <div class="final-screen" id="final-screen">
    <video id="final-video" autoplay muted playsinline>
      <source src="../img/metrofinal.mp4" type="video/mp4">
    </video>
  </div>

  <div class="final-controls" id="final-controls">
    <button class="final-btn" onclick="location.href='index.html'">Volver al Inicio</button>
    <button class="final-btn" onclick="location.reload()">Jugar de Nuevo</button>
  </div>

  <script>
    const startButton = document.getElementById('start-game');
    const cardsSection = document.getElementById('cards-section');
    const cardsGrid = document.getElementById('cards-grid');
    const counterDisplay = document.getElementById('counter');
    const scrollHint = document.getElementById('scroll-hint');
    const endGameBtnCards = document.getElementById('end-game-btn-cards');
    const pageFlipContainer = document.getElementById('page-flip-container');
    const finalScreen = document.getElementById('final-screen');
    const finalVideo = document.getElementById('final-video');
    const finalControls = document.getElementById('final-controls');

    const frontImage = '../img/cartas/front.png';
    const totalCards = 60;
    let interactionCount = 0;
    const INTERACTION_THRESHOLD = 8;
    let hasTriggeredFlip = false;

    function handleScroll(e) {
      if (interactionCount >= INTERACTION_THRESHOLD && !hasTriggeredFlip) {
        triggerPageFlip();
      }
    }

    function handleWheel(e) {
      if (interactionCount >= INTERACTION_THRESHOLD && !hasTriggeredFlip && e.deltaY > 0) {
        triggerPageFlip();
      }
    }

    function triggerPageFlip() {
      if (hasTriggeredFlip) return;
      hasTriggeredFlip = true;

      cardsSection.classList.add('hidden');
      pageFlipContainer.classList.add('active');

      setTimeout(() => {
        finalScreen.classList.add('active');
        finalVideo.play().catch(err => console.log('Auto-play blocked:', err));
      }, 1200);
    }

    function updateCounter() {
      counterDisplay.textContent = `${interactionCount} / ${INTERACTION_THRESHOLD}`;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderCards() {
      const backImages = Array.from({ length: totalCards }, (_, index) => {
        const id = String(index + 1).padStart(2, '0');
        return `../img/cartas/card${id}-back.png`;
      });

      const randomBacks = shuffle(backImages.slice());
      cardsGrid.innerHTML = '';

      randomBacks.forEach((backSrc, index) => {
        const cardButton = document.createElement('button');
        cardButton.className = 'card';
        cardButton.type = 'button';
        cardButton.setAttribute('aria-label', `Voltear carta ${index + 1}`);

        cardButton.innerHTML = `
          <span class="card-inner">
            <span class="card-face card-front">
              <img src="${frontImage}" alt="Frente de carta">
            </span>
            <span class="card-face card-back">
              <img src="${backSrc}" alt="Pregunta de carta ${index + 1}">
            </span>
          </span>
        `;

        cardButton.addEventListener('click', () => {
          cardsGrid.querySelectorAll('.card.is-flipped').forEach((openCard) => {
            if (openCard !== cardButton) {
              openCard.classList.remove('is-flipped');
            }
          });
          cardButton.classList.toggle('is-flipped');

          if (cardButton.classList.contains('is-flipped')) {
            interactionCount++;
            updateCounter();

            // Button always available, just counting
            if (interactionCount === INTERACTION_THRESHOLD) {
              updateCounter();
            }
          }
        });

        cardsGrid.appendChild(cardButton);
      });
    }

    startButton.addEventListener('click', () => {
      startButton.classList.add('hidden');
      cardsSection.classList.remove('hidden');
      renderCards();
    });

    endGameBtnCards.addEventListener('click', triggerPageFlip);
  </script>
</body>
</html>
