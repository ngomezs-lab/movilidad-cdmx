<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Próxima estación — Movilidad CDMX</title>
    <link rel="stylesheet" href="../css/docs.css">
    <style>
        body {
            background-image: url("../img/sinfiltros.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;
            color: #fff;
            display: grid;
            place-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .panel {
            max-width: 920px;
            padding: 2rem 1.5rem;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        }
        .next-title {
            font-size: clamp(2rem, 4vw, 3.1rem);
            margin: 0 0 1rem;
            line-height: 1.1;
            color: var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
            animation: titleFloat 4s ease-in-out infinite;
        }
        .next-body {
            font-size: clamp(1.05rem, 2.5vw, 1.25rem);
            margin: 0 auto 1.75rem;
            color: var(--secondary-color);
            opacity: 0.95;
            line-height: 1.3;
            max-width: 42rem;
            text-wrap: balance;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        }
        .next-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 1rem;
            padding: 0.5rem 0.9rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--secondary-color);
            font-size: 0.8rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }
        .next-kicker::before {
            content: "";
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: var(--title-color);
            box-shadow: 0 0 18px var(--title-color);
        }
        .next-link-wrap {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.9rem 1.3rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
        }
        .next-link-wrap:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.24);
        }
        .next-link-arrow {
            display: inline-block;
            transition: transform 180ms ease;
        }
        .next-link-wrap:hover .next-link-arrow {
            transform: translateX(4px);
        }

        @keyframes titleFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

    </style>
</head>

<body>
    <div class="panel">
        <div class="next-kicker">Antes de entrar</div>
        <h1 class="next-title">Escuchaste lo que ellas viven.</h1>
        <p class="next-body">Es momento de cuestionar lo que entre hombres muchas veces no se dice.</p>
        <div>
            <span>Próxima estación </span>
            <a href="sin-filtros.html" class="next-link-wrap">
                <span class="next-link">"Sin Filtros"</span>
                <span class="next-link-arrow">→</span>
            </a>
        </div>
    </div>
    <style>
        .next-link{ color: var(--title-color); text-decoration:none; font-weight:800; font-size:1.08rem; letter-spacing:0.02em; }
    </style>
</body>

</html>
