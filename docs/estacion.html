<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movilidad CDMX — Estación Interactiva</title>
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <link rel="stylesheet" href="https://use.typekit.net/wou8phv.css">
    <link rel="stylesheet" href="../css/docs.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0a0a0a;
            color: #ecf1f5;
            font-family: "adapter-mono-pe-variable", sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* Background y efectos ambiente */
        .metro-bg {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 1200px 600px at 50% 40%, rgba(255, 35, 122, 0.08), transparent 70%),
                radial-gradient(ellipse 900px 500px at 50% 60%, rgba(195, 250, 44, 0.06), transparent 70%),
                linear-gradient(180deg, #0f1419 0%, #0a0a0a 50%, #050505 100%);
            z-index: -2;
            pointer-events: none;
        }

        /* Video background del metro */
        .metro-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.4;
            pointer-events: none;
        }

        /* Overlay sobre video */
        .metro-overlay {
            position: fixed;
            inset: 0;
            background: 
                linear-gradient(90deg, transparent, rgba(255, 35, 122, 0.1), transparent),
                linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.3), rgba(0,0,0,0.5));
            z-index: -1;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* Niebla volumétrica */
        .fog-layer {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 150% 100% at 50% 50%, rgba(255, 35, 122, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse 100% 150% at 30% 30%, rgba(195, 250, 44, 0.08) 0%, transparent 35%);
            z-index: -1;
            pointer-events: none;
            filter: blur(40px);
            animation: fogDrift 8s ease-in-out infinite;
        }

        @keyframes fogDrift {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.8; }
        }

        /* Barra de navegación */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background: rgba(8, 10, 14, 0.85);
            border-bottom: 1px solid rgba(195, 250, 44, 0.1);
            box-shadow: 0 0 20px rgba(255, 35, 122, 0.05);
        }

        .site-nav {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .logo {
            font-family: "Oswald", sans-serif;
            color: #c3fa2c;
            font-size: 1.2rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-decoration: none;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(195, 250, 44, 0.3);
            transition: text-shadow 0.3s ease;
        }

        .logo:hover {
            text-shadow: 0 0 20px rgba(195, 250, 44, 0.6);
        }

        .site-nav ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .site-nav li a {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.9rem;
            color: #ecf1f5;
            border: 1px solid rgba(195, 250, 44, 0.2);
            text-decoration: none;
            transition: all 0.3s ease;
            background: rgba(195, 250, 44, 0.05);
        }

        .site-nav li a:hover {
            color: #c3fa2c;
            border-color: rgba(195, 250, 44, 0.5);
            background: rgba(195, 250, 44, 0.12);
            box-shadow: 0 0 15px rgba(195, 250, 44, 0.2);
            text-shadow: 0 0 8px rgba(195, 250, 44, 0.4);
        }

        /* Contenedor principal */
        .metro-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Scroll container para parallax */
        .scroll-container {
            position: relative;
            width: 100%;
            height: 100vh;
            padding: 0;
            overflow: hidden;
        }

        .station-sign {
            width: min(100%, 760px);
            margin: 0 auto 1.25rem;
            padding: 1rem;
            border-radius: 22px;
            border: 1px solid rgba(195, 250, 44, 0.28);
            background:
                linear-gradient(135deg, rgba(8, 10, 14, 0.86), rgba(255, 35, 122, 0.08)),
                rgba(8, 10, 14, 0.7);
            backdrop-filter: blur(14px);
            box-shadow:
                0 0 40px rgba(195, 250, 44, 0.1),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            display: grid;
            gap: 1rem;
            justify-items: center;
        }

        .station-sign img {
            width: clamp(220px, 38vw, 520px);
            height: auto;
            object-fit: contain;
            max-width: 520px;
            filter: drop-shadow(0 0 28px rgba(195, 250, 44, 0.38)) drop-shadow(0 0 48px rgba(255, 35, 122, 0.18));
            opacity: 0.98;
        }

        .station-heading-logo {
            display: block;
            margin: 0 auto 0.6rem;
            max-width: 480px;
            width: clamp(200px, 36vw, 460px);
            height: auto;
            filter: drop-shadow(0 0 20px rgba(195, 250, 44, 0.36)) drop-shadow(0 0 36px rgba(255, 35, 122, 0.14));
        }

        .station-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(236, 241, 245, 0.82);
            font-size: 0.86rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.04);
        }

        .station-kicker::before {
            content: '';
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: #c3fa2c;
            box-shadow: 0 0 12px rgba(195, 250, 44, 0.75);
        }

        .station-stage {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: 2rem 0 0;
            display: grid;
            gap: 1.25rem;
        }

        .focus-panel {
            display: grid;
            gap: 1rem;
            padding: 1rem 1.1rem;
            border-radius: 18px;
            border: 1px solid rgba(195, 250, 44, 0.22);
            background: linear-gradient(180deg, rgba(8, 10, 14, 0.78), rgba(8, 10, 14, 0.5));
            box-shadow: 0 0 26px rgba(255, 35, 122, 0.08);
        }

        .focus-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }

        .focus-chip {
            appearance: none;
            border: 1px solid rgba(195, 250, 44, 0.2);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-color);
            border-radius: 999px;
            padding: 0.65rem 0.95rem;
            font: inherit;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
        }

        .focus-chip:hover,
        .focus-chip.is-active {
            transform: translateY(-2px);
            border-color: rgba(195, 250, 44, 0.55);
            background: rgba(195, 250, 44, 0.12);
            color: #c3fa2c;
        }

        .focus-copy {
            font-size: 1rem;
            line-height: 1.7;
            color: rgba(236, 241, 245, 0.9);
        }

        .signal-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 0.75rem;
        }

        .signal-card {
            display: grid;
            gap: 0.35rem;
            padding: 0.9rem 1rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .signal-card strong {
            font-family: "Oswald", sans-serif;
            color: #c3fa2c;
            letter-spacing: 0.04em;
        }

        .signal-card:hover {
            transform: translateY(-4px);
            border-color: rgba(195, 250, 44, 0.35);
            background: rgba(195, 250, 44, 0.08);
        }

        /* Superficies de metro */
        .metro-surface {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .metro-floor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(180deg, 
                rgba(255, 35, 122, 0.1) 0%, 
                rgba(195, 250, 44, 0.06) 50%, 
                transparent 100%);
            border-top: 1px solid rgba(195, 250, 44, 0.2);
            z-index: -1;
            filter: blur(2px);
        }

            /* Logo anclado dentro del flujo, no flotante */
            .station-sign {
                margin: 0 auto 1.5rem;
                width: clamp(140px, 28vw, 420px);
                display: block;
                text-align: center;
            }

            .station-sign img {
                width: 100%;
                height: auto;
                object-fit: contain;
                filter: drop-shadow(0 0 18px rgba(195, 250, 44, 0.32)) drop-shadow(0 0 30px rgba(255, 35, 122, 0.14));
                opacity: 0.95;
            }

        /* Secciones de contenido */
        .content-section {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .content-section:nth-child(1) {
            background:
                radial-gradient(circle at 50% 20%, rgba(195, 250, 44, 0.1), transparent 28%),
                linear-gradient(135deg, rgba(0,0,0,0.74), rgba(255, 35, 122, 0.08));
        }

        .content-section:nth-child(2) {
            background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(195, 250, 44, 0.06));
        }

        .content-section:nth-child(3) {
            background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(255, 35, 122, 0.05));
        }

        /* Sección solo imagen: imagen grande y estática */
        .content-section.image-only {
            height: 100vh;
            min-height: 100vh;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .image-only-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 0 0;
        }

        .hero-static-image {
            width: 100%;
            height: 100%;
            max-width: none;
            object-fit: contain;
            display: block;
            margin: 0;
            filter: none;
            position: relative;
            z-index: 5;
        }

        .content-box {
            max-width: 700px;
            background: rgba(8, 10, 14, 0.6);
            border: 1px solid rgba(195, 250, 44, 0.3);
            border-radius: 16px;
            padding: 3rem 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 40px rgba(195, 250, 44, 0.1),
                inset 0 0 40px rgba(255, 35, 122, 0.03);
            transform: translateY(calc(var(--scroll, 0) * 0.06px));
            transition: all 0.3s ease;
        }

        .content-box:hover {
            border-color: rgba(195, 250, 44, 0.6);
            box-shadow: 
                0 0 60px rgba(195, 250, 44, 0.2),
                inset 0 0 40px rgba(255, 35, 122, 0.06);
        }

        .content-box h2 {
            font-family: "Oswald", sans-serif;
            font-size: 2.5rem;
            color: #c3fa2c;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-shadow: 
                0 0 10px rgba(195, 250, 44, 0.3),
                0 0 20px rgba(255, 35, 122, 0.1);
        }

        .content-box p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #ecf1f5;
            margin-bottom: 1.5rem;
        }

        .content-box .accent {
            color: #ff238a;
            font-weight: 700;
        }

        /* Botón interactivo */
        .cta-button {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(90deg, #c3fa2c, #ff238a);
            color: #08100e;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.05rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(195, 250, 44, 0.2), 0 0 40px rgba(255, 35, 122, 0.1);
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(195, 250, 44, 0.4), 0 0 80px rgba(255, 35, 122, 0.2);
        }

        /* Efectos de líneas de metro */
        .metro-lines {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.03;
            pointer-events: none;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(195, 250, 44, 0.05) 25%, rgba(195, 250, 44, 0.05) 26%, transparent 27%, transparent 74%, rgba(195, 250, 44, 0.05) 75%, rgba(195, 250, 44, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(255, 35, 122, 0.05) 25%, rgba(255, 35, 122, 0.05) 26%, transparent 27%, transparent 74%, rgba(255, 35, 122, 0.05) 75%, rgba(255, 35, 122, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
        }

        /* Glitch effect subtle */
        @keyframes glitch {
            0% {
                text-shadow: 
                    2px 0 #c3fa2c,
                    -2px 0 #ff238a;
            }
            20% {
                text-shadow: 
                    -2px 0 #c3fa2c,
                    2px 0 #ff238a;
            }
            40% {
                text-shadow: 
                    1px 0 #c3fa2c,
                    -1px 0 #ff238a;
            }
            60% {
                text-shadow: 
                    -1px 0 #c3fa2c,
                    1px 0 #ff238a;
            }
            100% {
                text-shadow: 
                    0 0 #c3fa2c,
                    0 0 #ff238a;
            }
        }

        .glitch-text:hover {
            animation: glitch 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .site-nav {
                flex-direction: column;
                gap: 1rem;
            }

            .content-box {
                padding: 2rem 1.5rem;
            }

            .content-box h2 {
                font-size: 2rem;
            }

            .station-sign {
                padding: 0.9rem;
            }

            .station-sign img {
                max-width: 180px;
            }

            .focus-panel {
                padding: 0.9rem;
            }

            .signal-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <video class="metro-video" autoplay muted loop playsinline>
        <source src="../img/videometro.mp4" type="video/mp4">
    </video>
    <div class="metro-bg"></div>
    <div class="metro-overlay"></div>
    <div class="fog-layer"></div>
    <div class="metro-lines"></div>
    <div class="metro-floor"></div>

    <header class="site-header">
        <nav class="site-nav" aria-label="Navegación principal">
            <a href="../index.html" class="logo" title="Ir al inicio">Movilidad CDMX</a>
            <ul>
                <li><a href="experiencia.html?autoplay=1">Experiencia</a></li>
                <li><a href="identidad.html">Galería</a></li>
                <li class="nav-intro">
                    <button class="nav-trigger" aria-haspopup="true" aria-expanded="false">Introducción</button>
                    <ul class="subnav" role="menu" aria-label="Secciones de introducción">
                        <li><a role="menuitem" href="index.html#introduccion">Introducción</a></li>
                        <li><a role="menuitem" href="index.html#objetivos">Objetivos</a></li>
                        <li><a role="menuitem" href="index.html#enfoque">Enfoque</a></li>
                        <li><a role="menuitem" href="index.html#metodologia">Metodología</a></li>
                        <li><a role="menuitem" href="index.html#problema">Problema</a></li>
                        <li><a role="menuitem" href="index.html#proposito">Propósito</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <div class="metro-container">
        <div class="scroll-container">
            <!-- Sección 1 -->
            <div class="content-section image-only" id="estacion">
                <div class="image-only-container">
                        <img src="../img/proyectolect1.png" alt="Proyecto — imagen principal" class="hero-static-image">
                <!-- Sección 2 y 3 eliminadas: página muestra solo la imagen estática como solicitaste -->
        </div>
    </div>

    <script>
        // No interactive scripts for this page — imagen estática solamente.
    </script>

    <script>
        (function(){
            const navIntro = document.querySelector('.nav-intro');
            if(!navIntro) return;
            const trigger = navIntro.querySelector('.nav-trigger');

            function closeMenu(){ navIntro.classList.remove('open'); if(trigger) trigger.setAttribute('aria-expanded', 'false'); }
            function openMenu(){ navIntro.classList.add('open'); if(trigger) trigger.setAttribute('aria-expanded', 'true'); }

            const wantsClickToggle = window.matchMedia && (window.matchMedia('(hover: none)').matches || window.matchMedia('(pointer: coarse)').matches);
            if (wantsClickToggle) {
                trigger.addEventListener('click', (e)=>{ e.stopPropagation(); const isOpen = navIntro.classList.toggle('open'); trigger.setAttribute('aria-expanded', String(isOpen)); });
            }
            document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeMenu(); });
            document.addEventListener('click', (e)=>{ if(!navIntro.contains(e.target)) closeMenu(); });
            navIntro.addEventListener('focusin', ()=> openMenu());
            navIntro.addEventListener('focusout', ()=> setTimeout(()=>{ if(!navIntro.contains(document.activeElement)) closeMenu(); }, 10));
        })();
    </script>

    <!-- No scroll logic required — page is full-screen static -->
    <footer class="site-footer" role="contentinfo" aria-label="Footer del sitio">
        <div class="site-footer-inner">
            <div class="site-footer-left">Expuestas — Proyecto de movilidad urbana y género · 2026</div>
            <div class="site-footer-right">Natasha Gómez · Sarai Bautista · Allison Baltazar</div>
        </div>
    </footer>
</body>
